version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: orbit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_dev_2024
      POSTGRES_DB: orbit
    ports:
      - "5433:5432"  # host 5433 — joallm-postgres may already use 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbit_redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # host 6380 — joallm-redis may already use 6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: orbit_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://orbit:orbit_dev_2024@postgres:5432/orbit
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      LLM_AUDIT_ENABLED: "false"
      AGENT_SEND_ENABLED: "false"
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    container_name: orbit_worker
    command: arq app.worker.settings.WorkerSettings
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://orbit:orbit_dev_2024@postgres:5432/orbit
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      AGENT_SEND_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: orbit_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
